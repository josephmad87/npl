name: Deployment smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Website or API deployment URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment_url, 'https://'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment
        shell: bash
        env:
          PREVIEW_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || github.event.deployment_status.environment_url }}
          DEPLOYMENT_DESCRIPTION: ${{ github.event.deployment.description }}
        run: |
          if [[ "$DEPLOYMENT_DESCRIPTION" == "Heroku" || "$PREVIEW_URL" == *".herokuapp.com"* ]]; then
            python3 ops/smoke_check.py --api-url "$PREVIEW_URL" --attempts 5 --retry-delay 3
          else
            python3 ops/smoke_check.py --site-url "$PREVIEW_URL" --attempts 5 --retry-delay 3
          fi
