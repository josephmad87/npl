[project]
name = "npl-api"
version = "0.1.0"
description = "Zimbabwe Cricket NPL backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "bcrypt>=4.2.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "sentry-sdk[fastapi]>=2.68.1,<3",
    "nh3>=0.3.2,<1",
    "pillow>=11.3.0,<13",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.3.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.16.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start with correctness-focused checks so the release gate is useful without
# mechanically rewriting the existing application in this baseline stage.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
